<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KhojKr – Login</title>
  <link rel="stylesheet" href="project.css" />
  <script src="https://cdn.tailwindcss.com" defer></script>
  <meta name="description" content="Login to KhojKr to explore tourist attractions">
  <meta name="theme-color" content="#0369a1">
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="min-h-screen flex items-center justify-center bg-cover bg-center" style="background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.3)), url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1470&q=80');">
    <div class="max-w-md w-full mx-4">
      <!-- Logo Section -->
      <div class="text-center mb-8">
        <svg class="w-20 h-20 mx-auto" viewBox="0 0 100 100">
          <path d="M50 10 C 25 10, 10 25, 10 50 C 10 75, 25 90, 50 90 C 75 90, 90 75, 90 50 C 90 25, 75 10, 50 10" fill="#0369a1"/>
          <path d="M50 30 C 40 30, 30 40, 30 50 C 30 60, 40 70, 50 70 C 60 70, 70 60, 70 50 C 70 40, 60 30, 50 30" fill="#f97316"/>
          <rect x="45" y="40" width="10" height="30" fill="#f97316"/>
        </svg>
        <h2 class="mt-4 text-4xl font-bold text-white">Welcome to KhojKr</h2>
        <p class="mt-2 text-white text-lg">Login to start exploring</p>
      </div>

      <!-- Login Form -->
      <div class="bg-white/10 backdrop-blur-md p-8 rounded-2xl shadow-xl border border-white/20">
        <form id="loginForm" class="space-y-6">
          <div>
            <label for="email" class="block text-white text-sm font-medium mb-2">Email Address</label>
            <input type="email" id="email" name="email" required 
                   class="w-full px-4 py-3 rounded-xl border-2 border-white/30 bg-white/10 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-blue-400 backdrop-blur-lg"
                   placeholder="Enter your email">
          </div>
          
          <div>
            <label for="password" class="block text-white text-sm font-medium mb-2">Password</label>
            <input type="password" id="password" name="password" required 
                   class="w-full px-4 py-3 rounded-xl border-2 border-white/30 bg-white/10 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-blue-400 backdrop-blur-lg"
                   placeholder="Enter your password">
          </div>

          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <input type="checkbox" id="remember" name="remember" 
                     class="h-4 w-4 rounded border-white/30 bg-white/10 text-blue-600 focus:ring-blue-500">
              <label for="remember" class="ml-2 block text-sm text-white">Remember me</label>
            </div>
            <a href="#" class="text-sm text-white hover:text-blue-400">Forgot password?</a>
          </div>

          <button type="submit" 
                  class="w-full bg-blue-600 text-white py-3 px-4 rounded-xl hover:bg-blue-700 transition-all duration-300 transform hover:scale-105 hover:shadow-lg flex items-center justify-center gap-2">
            <span>Sign In</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
          </button>
        </form>

        <div class="mt-6 text-center">
          <p class="text-white">Don't have an account? 
            <a href="#" class="text-blue-400 hover:text-blue-300 font-medium">Sign up</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      // Add your login logic here
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      // For demonstration, just log the values
      console.log('Login attempt:', { email, password });
      
      // Redirect to main page after successful login
      window.location.href = 'project.html';
    });
  </script>
</body>
</html>
