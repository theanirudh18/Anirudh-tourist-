
name: Tourist Project CI

on:
  push:
  pull_request:

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f project.html
          test -f login.html
          test -f project.css
          test -f project.js
          echo "All required project files exist!"

.
